name: admin
description: DM Admin app (D-053).
publish_to: none
version: 1.0.1+2
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  dm_core:
    path: ../../packages/dm_core
  flutter_riverpod: ^2.6.1
  go_router: ^17.2.3
  intl: ^0.20.3
  path_provider: ^2.1.5
  # QR labels (D-040, D-057): QR matrix, print dialog, share sheet, save to the gallery.
  qr: ^3.0.2
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4
  gal: ^2.3.1
  # Vehicle and staff photos from the camera or gallery, resized on the phone (D-057).
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
